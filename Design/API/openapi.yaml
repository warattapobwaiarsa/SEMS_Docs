components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sems_session
      description: HttpOnly, Secure, SameSite session cookie ที่ SEMS สร้างหลัง KKU OIDC callback
  schemas:
    Role:
      type: string
      enum:
      - ADMIN
      - EVALUATOR
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    RoundStatus:
      type: string
      enum:
      - DRAFT
      - OPEN
      - CLOSED
      - ARCHIVED
    EvaluationStatus:
      type: string
      enum:
      - DRAFT
      - REOPENED
      - SUBMITTED
      - CANCELLED
    ApplicantEvaluationStatus:
      type: string
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - MINIMUM_COMPLETE
      - FULLY_COMPLETE
      - FINALIZED
      - CLOSED_INCOMPLETE
    ImportStatus:
      type: string
      enum:
      - UPLOADED
      - MAPPED
      - VALIDATED
      - VALIDATION_FAILED
      - CONFIRMED
      - CANCELLED
    ReportStatus:
      type: string
      enum:
      - QUEUED
      - PROCESSING
      - READY
      - FAILED
      - EXPIRED
    ErrorDetail:
      type: object
      additionalProperties: true
      properties:
        field:
          type: string
        reason:
          type: string
        rowNumber:
          type: integer
        value: {}
        constraint:
          type: string
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - traceId
      - timestamp
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: ข้อมูลที่ส่งมาไม่ถูกต้อง
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        traceId:
          type: string
          example: 01J2Y7QY8M8F6QK1J8N9P0ABCD
        timestamp:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    SuccessMessage:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    User:
      type: object
      required:
      - id
      - kkuSub
      - email
      - displayName
      - role
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        kkuSub:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    CreateUserRequest:
      type: object
      required:
      - kkuSub
      - email
      - displayName
      - role
      additionalProperties: false
      properties:
        kkuSub:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
    UpdateUserRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'
    ScholarshipRound:
      type: object
      required:
      - id
      - code
      - name
      - status
      - startDate
      - endDate
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/RoundStatus'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        criteriaSetId:
          type:
          - string
          - 'null'
          format: uuid
        applicantCount:
          type: integer
          minimum: 0
        evaluationCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    CreateRoundRequest:
      type: object
      required:
      - code
      - name
      - startDate
      - endDate
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_-]{2,30}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    UpdateRoundRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    ImportBatch:
      type: object
      required:
      - id
      - roundId
      - fileName
      - status
      - uploadedBy
      - uploadedAt
      properties:
        id:
