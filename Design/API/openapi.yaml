openapi: 3.1.0
info:
  title: SEMS REST API
  version: 1.0.0-draft
  summary: Scholarship Evaluation Management System API Specification
  description: 'API Specification สำหรับระบบบริหารจัดการการประเมินทุนการศึกษา (SEMS)


    หลักการสำคัญ:

    - ใช้ KKU OAuth 2.1 / OpenID Connect สำหรับ Authentication และใช้ SEMS Session cookie หลัง callback

    - ใช้ RBAC สองบทบาท: ADMIN และ EVALUATOR พร้อม Object-level authorization

    - State-changing API ต้องใช้ CSRF token

    - ใช้เฉพาะ Evaluation สถานะ SUBMITTED ในการคำนวณผลสรุป

    - ผู้สมัครหนึ่งรายต่อรอบมี active Evaluation ได้สูงสุด 3 รายการ และผู้ประเมินคนเดิมห้ามซ้ำ

    - Error response ใช้รูปแบบเดียวกันทุก endpoint และทุกเหตุการณ์สำคัญต้องบันทึก Audit Event


    เอกสารนี้เป็น Draft สำหรับ System Design Review; ค่าที่ยังต้องยืนยัน เช่น สูตรคะแนน การปัดเศษ

    ขนาดไฟล์สูงสุด Rate Limit และ Reopen Policy ถูกระบุให้เป็น configuration/policy แทนการ hard-code'
  contact:
    name: SEMS Project Team
servers:
- url: https://sems.example.kku.ac.th/api/v1
  description: Production (placeholder)
- url: http://localhost:3001/api/v1
  description: Local development
tags:
- name: Auth
  description: KKU SSO, SEMS Session และข้อมูลผู้ใช้ปัจจุบัน
- name: Users
  description: การเชื่อมโยง KKU Account, Role และสถานะบัญชี SEMS
- name: Scholarship Rounds
  description: วงจร Draft → Open → Closed → Archived
- name: Imports
  description: อัปโหลด Mapping Preview Validation และ Confirm ข้อมูลผู้สมัคร
- name: Applicants
  description: ค้นหาและจัดการข้อมูลผู้สมัครแยกตามรอบทุน
- name: Documents
  description: Metadata และ content ของ PDF/JPG/PNG ผ่าน Backend authorization
- name: Criteria Sets
  description: ชุดเกณฑ์ เวอร์ชัน และการเปิดใช้งาน
- name: Evaluations
  description: เลือกผู้สมัคร Draft Review Submit Cancel และ Reopen
- name: Result Summaries
  description: ผลสรุปจาก Submitted 2–3 คน และ Dashboard
- name: Reports
  description: สร้างและดาวน์โหลด Excel/CSV
- name: Audit Logs
  description: ค้นหาเหตุการณ์สำคัญโดยไม่บันทึก secret/token
security:
- cookieAuth: []
paths:
  /auth/login:
    get:
      tags:
      - Auth
      summary: เริ่มเข้าสู่ระบบด้วย KKU SSO
      operationId: startLogin
      responses:
        '302':
          description: Redirect ไปยัง KKU authorization endpoint
          headers:
            Location:
              schema:
                type: string
                format: uri
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-roles: []
      x-error-codes:
      - SSO_UNAVAILABLE
      - INVALID_RETURN_URL
      x-validation:
      - returnUrl ต้องเป็น path ภายในระบบเท่านั้น
      x-audit-events:
      - AUTH_LOGIN_STARTED
      description: Backend สร้าง state, nonce, PKCE code_verifier/code_challenge และ Redirect ไป KKU OAuth 2.1/OIDC
      parameters:
      - name: returnUrl
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
        description: URL ภายใน SEMS ที่จะกลับหลังเข้าสู่ระบบ
      security: []
  /auth/callback:
    get:
      tags:
      - Auth
      summary: รับ Callback จาก KKU SSO
      operationId: handleLoginCallback
      responses:
        '302':
          description: สร้าง SEMS Session สำเร็จและ Redirect กลับระบบ
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: Frontend URL
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-roles: []
      x-error-codes:
      - AUTH_CALLBACK_INVALID
      - STATE_MISMATCH
      - NONCE_MISMATCH
      - TOKEN_VALIDATION_FAILED
      - USER_NOT_PROVISIONED
      - USER_INACTIVE
      - SSO_UNAVAILABLE
      x-validation:
      - ตรวจ state และ nonce
      - แลก authorization code ด้วย PKCE verifier
      - ตรวจลายเซ็น/issuer/audience/expiry ของ id_token
      - ใช้ KKU sub เป็นตัวระบุถาวร
      x-audit-events:
      - AUTH_LOGIN_SUCCESS
      - AUTH_LOGIN_FAILURE
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      - name: error_description
        in: query
        required: false
        schema:
          type: string
      security: []
  /auth/me:
    get:
      tags:
      - Auth
      summary: อ่านข้อมูลผู้ใช้ปัจจุบัน
      operationId: getCurrentUser
      responses:
        '200':
          description: ข้อมูลผู้ใช้และสิทธิ์ปัจจุบัน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-roles: &id001
      - ADMIN
      - EVALUATOR
      x-error-codes:
      - AUTH_REQUIRED
      - USER_INACTIVE
      x-validation:
      - Session ต้องยังไม่หมดอายุและบัญชี SEMS ต้อง ACTIVE
      x-audit-events: []
  /auth/logout:
    post:
      tags:
      - Auth
      summary: ออกจากระบบ SEMS
      operationId: logout
      responses:
        '204':
          description: ยกเลิก SEMS Session สำเร็จ
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-roles: *id001
      x-error-codes:
      - AUTH_REQUIRED
      - CSRF_INVALID
      - SSO_LOGOUT_FAILED
      x-validation:
      - ยกเลิก Session ฝั่ง SEMS เสมอ
      - การออกจาก KKU SSO ทั้งหมดขึ้นกับ logout mode ที่กำหนด
      x-audit-events:
      - AUTH_LOGOUT
      parameters:
      - &id003
        name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
        description: CSRF token สำหรับคำขอที่เปลี่ยนแปลงข้อมูล
  /users:
    get:
      tags:
      - Users
      summary: ค้นหาและแสดงผู้ใช้งาน SEMS
      operationId: listUsers
      responses:
        '200':
          description: รายการผู้ใช้งาน
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - meta
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-roles: &id002
      - ADMIN
      x-error-codes:
      - AUTH_REQUIRED
      - FORBIDDEN
      x-validation:
      - pageSize ไม่เกิน 100
      x-audit-events: []
      parameters:
      - &id004
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: หน้าปัจจุบัน
      - &id005
        name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: จำนวนรายการต่อหน้า
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      - name: role
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Role'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserStatus'
    post:
      tags:
      - Users
      summary: เชื่อมโยง KKU Account และสร้างบัญชี SEMS
      operationId: createUser
      responses:
        '201':
          description: สร้างบัญชีสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-roles: *id002
      x-error-codes:
      - VALIDATION_ERROR
      - DUPLICATE_KKU_SUB
      - DUPLICATE_EMAIL
      - CSRF_INVALID
      x-validation:
      - kkuSub และ email ต้องไม่ซ้ำ
      - ระบบไม่รับหรือจัดเก็บรหัสผ่าน KKU
      x-audit-events:
      - USER_CREATED
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
  /users/{userId}:
    get:
      tags:
      - Users
      summary: อ่านรายละเอียดผู้ใช้งาน
      operationId: getUser
      responses:
        '200':
          description: รายละเอียดผู้ใช้งาน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles: *id002
      x-error-codes:
      - USER_NOT_FOUND
      x-validation: []
      x-audit-events: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: รหัสผู้ใช้
    patch:
      tags:
      - Users
      summary: แก้ไขชื่อหรือบทบาทผู้ใช้งาน
      operationId: updateUser
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-roles: *id002
      x-error-codes:
      - USER_NOT_FOUND
      - VALIDATION_ERROR
      - CONCURRENCY_CONFLICT
      - CSRF_INVALID
      x-validation:
      - ห้ามลดสิทธิ์ผู้ดูแลระบบคนสุดท้าย
      - If-Match ต้องตรงเมื่อส่งมา
      x-audit-events:
      - USER_UPDATED
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: รหัสผู้ใช้
      - *id003
      - &id006
        name: If-Match
        in: header
        required: false
        schema:
          type: string
        description: Optimistic concurrency token เช่น W/"7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
  /users/{userId}/activate:
    post:
      tags:
      - Users
      summary: เปิดสิทธิ์ใช้งาน SEMS
      operationId: setUserStatusActivate
      responses:
        '200':
          description: ปรับสถานะสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-roles: *id002
      x-error-codes:
      - USER_NOT_FOUND
      - LAST_ACTIVE_ADMIN
      - CSRF_INVALID
      x-validation:
      - ห้ามปิดสิทธิ์ผู้ดูแลระบบ ACTIVE คนสุดท้าย
      x-audit-events:
      - USER_ACTIVATED
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: รหัสผู้ใช้
      - *id003
  /users/{userId}/deactivate:
    post:
      tags:
      - Users
      summary: ปิดสิทธิ์ใช้งาน SEMS
      operationId: setUserStatusDeactivate
      responses:
        '200':
          description: ปรับสถานะสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-roles: *id002
      x-error-codes:
      - USER_NOT_FOUND
      - LAST_ACTIVE_ADMIN
      - CSRF_INVALID
      x-validation:
      - ห้ามปิดสิทธิ์ผู้ดูแลระบบ ACTIVE คนสุดท้าย
      x-audit-events:
      - USER_DEACTIVATED
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: รหัสผู้ใช้
      - *id003
  /scholarship-rounds:
    get:
      tags:
      - Scholarship Rounds
      summary: แสดงรอบทุน
      operationId: listScholarshipRounds
      responses:
        '200':
          description: รายการรอบทุน
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScholarshipRound'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-roles: *id001
      x-error-codes:
      - AUTH_REQUIRED
      x-validation:
      - Evaluator เห็นเฉพาะรอบที่เกี่ยวข้อง โดยค่าเริ่มต้นคือ OPEN
      x-audit-events: []
      parameters:
      - *id004
      - *id005
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/RoundStatus'
    post:
      tags:
      - Scholarship Rounds
      summary: สร้างรอบทุน
      operationId: createScholarshipRound
      responses:
        '201':
          description: สร้างรอบทุนสถานะ DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScholarshipRound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-roles: *id002
      x-error-codes:
      - VALIDATION_ERROR
      - DUPLICATE_ROUND_CODE
      - INVALID_DATE_RANGE
      - CSRF_INVALID
      x-validation:
      - startDate ต้องไม่เกิน endDate
      - code ต้องไม่ซ้ำ
      x-audit-events:
      - ROUND_CREATED
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoundRequest'
  /scholarship-rounds/{roundId}:
    get:
      tags:
      - Scholarship Rounds
      summary: อ่านรายละเอียดรอบทุน
      operationId: getScholarshipRound
      responses:
        '200':
          description: รายละเอียดรอบทุน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScholarshipRound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles: *id001
      x-error-codes:
      - ROUND_NOT_FOUND
      - ACCESS_DENIED
      x-validation: []
      x-audit-events: []
      parameters:
      - name: roundId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: รหัสรอบทุน
    patch:
      tags:
      - Scholarship Rounds
      summary: แก้ไขรอบทุนสถานะ DRAFT
      operationId: updateScholarshipRound
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScholarshipRound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-roles: *id002
      x-error-codes:
      - ROUND_NOT_FOUND
      - ROUND_STATE_INVALID
      - ROUND_HAS_EVALUATIONS
      - INVALID_DATE_RANGE
      - CONCURRENCY_CONFLICT
      - CSRF_INVALID
      x-validation:
      - แก้ไขข้อมูลหลักได้เมื่อ DRAFT
      - หากมี Evaluation แล้วห้ามเปลี่ยนข้อมูลที่กระทบผล
      x-audit-events:
      - ROUND_UPDATED
      parameters:
      - name: roundId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: รหัสรอบทุน
      - *id003
      - *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoundRequest'
  /scholarship-rounds/{roundId}/open:
    post:
      tags:
      - Scholarship Rounds
      summary: เปิดรอบทุน
      operationId: setRoundOpen
      responses:
        '200':
          description: เปลี่ยนสถานะเป็น OPEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScholarshipRound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-roles: *id002
      x-error-codes:
      - ROUND_NOT_FOUND
      - ROUND_STATE_INVALID
      - CRITERIA_REQUIRED
      - CRITERIA_INVALID
      - NO_APPLICANTS
      - CSRF_INVALID
      x-validation:
      - สถานะเดิมต้อง DRAFT
      - ต้องมี Criteria Set ACTIVE และมีผู้สมัครอย่างน้อย 1 ราย
      x-audit-events:
      - ROUND_OPENED
      parameters:
      - name: roundId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: รหัสรอบทุน
      - *id003
  /scholarship-rounds/{roundId}/close:
    post:
      tags:
      - Scholarship Rounds
      summary: ปิดรอบทุน
      operationId: setRoundClose
      responses:
        '200':
          description: เปลี่ยนสถานะเป็น CLOSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScholarshipRound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-roles: *id002
      x-error-codes:
      - ROUND_NOT_FOUND
      - ROUND_STATE_INVALID
      - CSRF_INVALID
      x-validation:
      - สถานะเดิมต้อง OPEN
      - ปิดการสร้าง/Submit Evaluation ใหม่
